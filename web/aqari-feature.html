<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>عقاري | ميزة ذكية</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f8fb;color:#071d35}body{min-height:100vh}header{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,#071d35,#0b3453);color:#fff;padding:14px max(14px,calc((100vw - 980px)/2));display:flex;align-items:center;gap:12px;box-shadow:0 6px 25px #071d3530}header button{border:0;background:#ffffff1c;color:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer}h1{font-size:20px;margin:0}header p{font-size:11px;color:#c8d7e6;margin:3px 0 0}.wrap{width:min(980px,100%);margin:auto;padding:20px 14px 50px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #071d350b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#64748b}.field input,.field select{width:100%;padding:13px;border:1px solid #d8e1eb;border-radius:12px;background:#fbfcfe;font:inherit}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:#d8ad3d;color:#071d35;font:inherit;font-weight:900;margin-top:13px}.result{margin-top:13px;padding:14px;border-radius:14px;background:#eef8f7;line-height:1.9}.note{padding:13px;border-radius:14px;background:#eef8f7;border-right:4px solid #13a6a1;line-height:1.8;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header><button onclick="history.back()" aria-label="رجوع">→</button><div><h1 id="title">عقاري</h1><p id="sub">ميزة مستقلة</p></div></header><main class="wrap" id="app"></main><script>(function(){const q=new URLSearchParams(location.search),id=q.get('feature')||'purchase';const data={purchase:['محاكي شراء العقار','طابق رغبتك مع الميزانية التقريبية'],build:['حاسبة بناء العقار','تقدير أولي لتكلفة البناء'],handover:['تسليم العقار','قائمة فحص استلام العقار'],exchange:['مبادلة العقارات','سجل تفاصيل العقار المطلوب للمبادلة'],investment:['الاستثمار العقاري','احسب العائد السنوي'],daily:['عقار اليوم','فرصة عقارية مميزة']};const d=data[id]||data.purchase;document.title='عقاري | '+d[0];document.getElementById('title').textContent=d[0];document.getElementById('sub').textContent=d[1];const app=document.getElementById('app');if(id==='purchase')app.innerHTML='<section class="card"><h2>محاكي شراء العقار</h2><p>حدد نوع العقار والميزانية التقريبية وسنحسب لك نطاقاً مناسباً للبحث.</p><div class="grid"><div class="field"><label>نوع العقار</label><select id="type"><option>منازل</option><option>شقق</option><option>قطع أراضي</option><option>مشتملات</option><option>محلات</option><option>مخازن</option></select></div><div class="field"><label>الميزانية التقريبية بالدينار</label><input id="budget" type="number" placeholder="200000000"></div></div><button class="primary" id="go">محاكاة الشراء</button><div id="out"></div></section><div class="note">هذه الصفحة مستقلة بالكامل وليست نافذة منبثقة.</div>';else if(id==='build')app.innerHTML='<section class="card"><h2>حاسبة بناء العقار</h2><div class="grid"><div class="field"><label>المساحة م²</label><input id="area" type="number" placeholder="200"></div><div class="field"><label>مستوى التشطيب</label><select id="rate"><option value="450000">اقتصادي</option><option value="650000" selected>متوسط</option><option value="900000">جيد جداً</option><option value="1200000">فاخر</option></select></div></div><button class="primary" id="go">احسب التكلفة</button><div id="out"></div></section>';else if(id==='handover')app.innerHTML='<section class="card"><h2>قائمة التسليم</h2>'+['مطابقة الوثائق والملكية','فحص الكهرباء والماء والصرف','فحص الأبواب والنوافذ','استلام المفاتيح والريموتات','تصوير حالة العقار','تثبيت النواقص'].map(x=>'<label style="display:block;padding:12px;border:1px solid #e1e8f0;border-radius:12px;margin:8px 0"><input type="checkbox"> '+x+'</label>').join('')+'</section>';else if(id==='investment')app.innerHTML='<section class="card"><h2>حساب العائد</h2><div class="grid"><div class="field"><label>سعر الشراء</label><input id="p" type="number"></div><div class="field"><label>الإيجار الشهري</label><input id="r" type="number"></div><div class="field"><label>المصاريف السنوية</label><input id="e" type="number"></div></div><button class="primary" id="go">احسب العائد</button><div id="out"></div></section>';else if(id==='exchange')app.innerHTML='<section class="card"><h2>طلب مبادلة عقار</h2><div class="grid"><div class="field"><label>نوع العقار</label><input></div><div class="field"><label>الموقع</label><input></div><div class="field"><label>المساحة</label><input></div><div class="field"><label>السعر التقريبي</label><input></div></div><button class="primary" onclick="document.getElementById(\'out\').innerHTML=\'<div class=result>تم حفظ الطلب كمسودة على هذا الجهاز.</div>\'">حفظ طلب المبادلة</button><div id="out"></div></section>';else app.innerHTML='<section class="card"><h2>⭐ فرصة اليوم</h2><div class="note">لا توجد فرصة مميزة متاحة حالياً. سيتم عرض العقارات الحالية هنا.</div></section>';const money=n=>new Intl.NumberFormat('ar-IQ').format(Math.round(Number(n)||0))+' د.ع';const go=document.getElementById('go');if(go)go.onclick=function(){if(id==='purchase'){const b=Number(document.getElementById('budget').value);document.getElementById('out').innerHTML=b?'<div class="result">نوع العقار: <b>'+document.getElementById('type').value+'</b><br>الميزانية: <b>'+money(b)+'</b><br>نطاق البحث المقترح: من '+money(b*.9)+' إلى '+money(b*1.1)+'</div>':'<div class="note">أدخل الميزانية أولاً.</div>'}else if(id==='build'){const a=Number(document.getElementById('area').value),r=Number(document.getElementById('rate').value);document.getElementById('out').innerHTML=a?'<div class="result">التكلفة التقديرية: <b>'+money(a*r)+'</b></div>':'<div class="note">أدخل المساحة أولاً.</div>'}else if(id==='investment'){const p=Number(document.getElementById('p').value),r=Number(document.getElementById('r').value),e=Number(document.getElementById('e').value)||0;if(!p||!r){document.getElementById('out').innerHTML='<div class="note">أدخل سعر الشراء والإيجار.</div>';return}const net=r*12-e;document.getElementById('out').innerHTML='<div class="result">الصافي السنوي: <b>'+money(net)+'</b><br>العائد السنوي: <b>'+(net/p*100).toFixed(2)+'%</b></div>'}}})();</script></body></html>
