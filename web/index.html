<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#071d35"/><meta name="apple-mobile-web-app-capable" content="yes"/><title>عقاري | سوق كركوك</title><link rel="preconnect" href="https://images.unsplash.com"/><script type="importmap">{"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client"}}</script><style>body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#101828}*{box-sizing:border-box}.aq-tools{margin:16px 14px 100px;background:#fff;border-radius:24px;padding:16px;box-shadow:0 8px 30px #071d3514}.aq-tools h2{margin:4px 0 6px}.aq-tools .sub{color:#667085;font-size:13px;margin-bottom:14px}.aq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.aq-tool{border:1px solid #e4e7ec;border-radius:18px;background:#fff;padding:14px;text-align:right;min-height:105px}.aq-tool b{display:block;margin:7px 0 4px}.aq-tool small{color:#667085;line-height:1.5}.aq-tool.on{border-color:#d9b44a;background:#fffaf0}.aq-page{margin:14px 0;padding:14px;border-radius:20px;background:#f8fafc}.aq-page h3{margin:4px 0 12px}.aq-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.aq-page input,.aq-page select,.aq-page textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;font:inherit}.aq-page textarea{min-height:90px;resize:vertical}.aq-btn{border:0;border-radius:13px;padding:12px 14px;background:#071d35;color:#fff;font-weight:700;margin-top:10px}.aq-result{margin-top:12px;padding:12px;border-radius:14px;background:#ecfdf3;border:1px solid #abefc6}.aq-check{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.aq-night{background:#101828!important;color:#fff!important}.aq-night .aq-page{background:#182230}.aq-night input,.aq-night select,.aq-night textarea{background:#111827;color:#fff;border-color:#344054}</style></head><body><div id="root"></div><script type="module" src="./main.jsx?v=20260903-r6"></script><script>(function(){const FEATURES=[['🧮','محاكي شراء العقار','حدد النوع وميزانيتك وشوف الخيارات'],['🏗️','حاسبة بناء العقار','تقدير أولي لتكلفة البناء'],['🤝','تسليم العقار','قائمة تسليم مرتبة خطوة بخطوة'],['🌙','الوضع الليلي','تفعيل مريح ويحفظ اختيارك'],['🔄','مبادلة العقارات','اعرض عقارك للمبادلة بكل تفاصيله'],['📈','الاستثمار العقاري','احسب الإيجار والعائد السنوي'],['⭐','عقار اليوم','فرصة مميزة تتغير يومياً']];let active=false,selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('en-US').format(Math.round(n))+' د.ع';function root(){return document.getElementById('root')}function props(){return window.__AQARI_PROPS__||[]}function panel(){let p=document.getElementById('aq-tools');if(!p){p=document.createElement('section');p.id='aq-tools';p.className='aq-tools';root()?.appendChild(p)}return p}function render(){const p=panel();p.innerHTML='<h2>✨ مميزات عقاري</h2><div class="sub">مميزات بسيطة وواضحة — اضغط على أي ميزة لتعمل مباشرة.</div><div class="aq-grid">'+FEATURES.map((f,i)=>'<button class="aq-tool '+(selected===i?'on':'')+'" data-f="'+i+'"><span style="font-size:25px">'+f[0]+'</span><b>'+f[1]+'</b><small>'+f[2]+'</small></button>').join('')+'</div><div id="aq-page"></div>';p.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;selected=+b.dataset.f;show(selected);render();};show(selected)}function show(i){const box=document.getElementById('aq-page');if(!box)return;if(i===null){box.innerHTML='';return}if(i===0){box.innerHTML='<h3>🧮 محاكي شراء العقار</h3><div class="aq-row"><select id="buyType"><option>الكل</option><option>منازل</option><option>شقق</option><option>قطع أراضي</option><option>مشتملات</option></select><input id="buyBudget" type="number" placeholder="ميزانيتك بالدينار"/></div><button class="aq-btn" id="buyGo">اعرض المناسب</button><div id="buyOut"></div>';document.getElementById('buyGo').onclick=()=>{const type=document.getElementById('buyType').value,b=+document.getElementById('buyBudget').value||0,arr=props().filter(x=>(type==='الكل'||x.c===type)&&(!b||x.p<=b));document.getElementById('buyOut').innerHTML=arr.length?'<div class="aq-result">'+arr.map(x=>'🏠 <b>'+esc(x.t)+'</b> — '+money(x.p)+'<br><small>📍 '+esc(x.d)+' • '+x.a+' م²</small>').join('<hr>')+'</div>':'<div class="aq-result">ماكو عقار مطابق حالياً. جرّب ميزانية أعلى.</div>'}}else if(i===1){box.innerHTML='<h3>🏗️ حاسبة بناء العقار</h3><div class="aq-row"><select id="buildType"><option>اقتصادي</option><option>متوسط</option><option>جيد</option><option>فاخر</option></select><input id="buildArea" type="number" placeholder="المساحة م²"/></div><button class="aq-btn" id="buildGo">احسب التقدير</button><div id="buildOut"></div>';document.getElementById('buildGo').onclick=()=>{const a=+document.getElementById('buildArea').value||0,t=document.getElementById('buildType').value,r={اقتصادي:700000,متوسط:1000000,جيد:1400000,فاخر:1900000}[t];document.getElementById('buildOut').innerHTML=a?'<div class="aq-result">التكلفة التقديرية: <b>'+money(a*r)+'</b><br><small>تقدير تقريبي فقط ويختلف حسب المواد والمقاول والموقع.</small></div>':'<div class="aq-result">اكتب المساحة أولاً.</div>'}}else if(i===2){box.innerHTML='<h3>🤝 تسليم العقار</h3><div id="checks">'+['تطابق هوية المالك والعقد','فحص الكهرباء والماء والصرف','فحص الأبواب والنوافذ والأقفال','تسجيل قراءة العدادات','استلام المفاتيح والريموتات','تصوير حالة العقار وقت التسليم','توقيع محضر الاستلام'].map((x,n)=>'<label class="aq-check"><input type="checkbox" data-c="'+n+'">'+x+'</label>').join('')+'</div><button class="aq-btn" id="checkReset">إعادة القائمة</button>';document.getElementById('checkReset').onclick=()=>document.querySelectorAll('[data-c]').forEach(x=>x.checked=false)}else if(i===3){const dark=localStorage.getItem('aqariNight')==='1';document.body.classList.toggle('aq-night',dark);box.innerHTML='<h3>🌙 الوضع الليلي</h3><p>فعّل أو عطّل الوضع الليلي، والاختيار ينحفظ تلقائياً.</p><button class="aq-btn" id="nightBtn">'+(dark?'☀️ إيقاف الوضع الليلي':'🌙 تفعيل الوضع الليلي')+'</button>';document.getElementById('nightBtn').onclick=()=>{const on=!document.body.classList.contains('aq-night');document.body.classList.toggle('aq-night',on);localStorage.setItem('aqariNight',on?'1':'0');show(3)}}else if(i===4){box.innerHTML='<h3>🔄 مبادلة العقارات</h3><div class="aq-row"><input id="exType" placeholder="نوع العقار"><input id="exLoc" placeholder="الموقع"></div><div class="aq-row"><input id="exArea" type="number" placeholder="المساحة م²"><input id="exRooms" type="number" placeholder="غرف النوم"></div><div class="aq-row"><input id="exLiving" placeholder="غرف المعيشة"><input id="exBath" placeholder="الحمامات"></div><div class="aq-row"><input id="exKitchen" placeholder="المطابخ"><input id="exFloors" placeholder="عدد الطوابق"></div><input id="exPrice" type="number" placeholder="السعر التقريبي" style="margin-top:9px"><textarea id="exMore" placeholder="كراج، حديقة، سطح، عمر العقار، الحالة، الإضافات، وأي معلومات أخرى"></textarea><button class="aq-btn" id="exSave">حفظ طلب المبادلة</button><div id="exOut"></div>';document.getElementById('exSave').onclick=()=>{const data={type:document.getElementById('exType').value,loc:document.getElementById('exLoc').value,area:document.getElementById('exArea').value,rooms:document.getElementById('exRooms').value,price:document.getElementById('exPrice').value,more:document.getElementById('exMore').value};localStorage.setItem('aqariExchange',JSON.stringify(data));document.getElementById('exOut').innerHTML='<div class="aq-result">✅ تم حفظ طلب المبادلة على هذا الجهاز. سيتم استخدامه عند ربط قاعدة البيانات.</div>'}}else if(i===5){box.innerHTML='<h3>📈 الاستثمار العقاري</h3><div class="aq-row"><input id="invPrice" type="number" placeholder="سعر الشراء"><input id="invRent" type="number" placeholder="الإيجار الشهري"></div><button class="aq-btn" id="invGo">احسب العائد</button><div id="invOut"></div>';document.getElementById('invGo').onclick=()=>{const p=+document.getElementById('invPrice').value||0,r=+document.getElementById('invRent').value||0,y=r*12,roi=p?y/p*100:0;document.getElementById('invOut').innerHTML=p&&r?'<div class="aq-result">الإيجار السنوي: <b>'+money(y)+'</b><br>العائد السنوي التقريبي: <b>'+roi.toFixed(2)+'%</b><br><small>لا يشمل المصاريف والصيانة والفراغ.</small></div>':'<div class="aq-result">أدخل سعر الشراء والإيجار الشهري.</div>'}}else if(i===6){const arr=props();const x=arr.length?arr[new Date().getDate()%arr.length]:null;box.innerHTML=x?'<h3>⭐ عقار اليوم</h3><div class="aq-result"><b style="font-size:18px">'+esc(x.t)+'</b><br>📍 '+esc(x.city)+' - '+esc(x.d)+'<br>📐 '+x.a+' م²<br>💰 <b>'+money(x.p)+'</b><br><button class="aq-btn" id="dailyOpen">فتح تفاصيل العقار</button></div>':'<div class="aq-result">لا توجد عقارات حالياً.</div>';document.getElementById('dailyOpen')?.addEventListener('click',()=>{document.querySelector('[data-f="6"]')?.scrollIntoView({behavior:'smooth'})})}}function mount(){if(!root())return;if(!document.getElementById('aq-tools'))render()}new MutationObserver(()=>{if(active&&!document.getElementById('aq-tools'))render()}).observe(document.body,{childList:true,subtree:true});setTimeout(()=>{const n=document.querySelector('nav');if(n&&!n.querySelector('.aq-more-btn')){const b=document.createElement('button');b.className='aq-more-btn';b.innerHTML='✨<small>المزيد</small>';b.onclick=()=>{active=true;render();document.getElementById('aq-tools')?.scrollIntoView({behavior:'smooth',block:'start'})};n.insertBefore(b,n.lastElementChild)}},1200);setInterval(()=>{const n=document.querySelector('nav');if(n&&!n.querySelector('.aq-more-btn')){const b=document.createElement('button');b.className='aq-more-btn';b.innerHTML='✨<small>المزيد</small>';b.onclick=()=>{active=true;render();document.getElementById('aq-tools')?.scrollIntoView({behavior:'smooth',block:'start'})};n.insertBefore(b,n.lastElementChild)}},1500);mount()})();</script></body></html>
