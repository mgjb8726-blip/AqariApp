<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>محاكي المجمع — بيت عصري 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c9d9e4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}.panel{pointer-events:auto;background:rgba(12,20,28,.82);backdrop-filter:blur(18px);color:#fff;border:1px solid #fff2;border-radius:18px;box-shadow:0 12px 40px #0004}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.brand{padding:10px 14px;font-weight:900}.brand b{color:#e9bd55}.actions{display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#fff;color:#14232f;font-weight:850}.gold{background:#e9bd55!important}.side{position:absolute;right:12px;top:68px;width:205px;padding:11px;max-height:54vh;overflow:auto}.side h3{margin:2px 0 8px;font-size:14px}.house{width:100%;padding:9px;margin:5px 0;border:1px solid #fff1;border-radius:11px;background:#ffffff0c;color:#fff;text-align:right}.house.active{background:#e9bd55;color:#14232f}.info{position:absolute;left:12px;bottom:12px;width:min(310px,calc(100% - 24px));padding:13px;display:none}.info.show{display:block}.info h2{margin:0 0 4px}.info p{margin:3px 0;color:#d5dce2;font-size:12px}.controls{position:absolute;left:12px;bottom:13px;width:130px;height:130px;pointer-events:auto}.stick{position:absolute;inset:20px;border-radius:50%;background:#13253499;border:1px solid #fff2}.key{position:absolute;width:38px;height:38px;border-radius:11px;background:#fff;color:#14232f;display:grid;place-items:center;font-weight:900}.up{left:46px;top:0}.down{left:46px;bottom:0}.left{left:0;top:46px}.right{right:0;top:46px}.hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:11px;background:#13253499;color:#fff;font-size:11px;white-space:nowrap}
@media(max-width:700px){.side{width:172px;max-height:45vh}.hint{display:none}.controls{transform:scale(.82);transform-origin:bottom left}}
</style>
</head>
<body>
<div id="hud">
 <div class="top"><div class="panel brand">محاكي المجمع <b>3D</b> • بيت عصري</div><div class="actions"><button class="btn" id="topView">الخريطة</button><button class="btn gold" id="enterBtn">دخول البيت</button></div></div>
 <div class="panel side"><h3>🏠 اختر بيتاً</h3><div id="houses"></div></div>
 <div id="info" class="panel info"><h2 id="infoTitle"></h2><p id="infoText"></p><button class="btn gold" id="goBtn">الاقتراب من البيت</button></div>
 <div class="controls"><div class="stick"></div><div class="key up" data-k="w">▲</div><div class="key down" data-k="s">▼</div><div class="key left" data-k="a">◀</div><div class="key right" data-k="d">▶</div></div>
 <div class="hint">اسحب للدوران • الأزرار للحركة • داخل البيت للتجول</div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xc9d9e4);
scene.fog=new THREE.Fog(0xc9d9e4,130,330);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,700);
camera.position.set(0,48,72);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=3;controls.maxDistance=190;
const hemi=new THREE.HemisphereLight(0xffffff,0x60705f,2.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffedcf,3.5);sun.position.set(-70,110,55);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-150;sun.shadow.camera.right=150;sun.shadow.camera.top=150;sun.shadow.camera.bottom=-150;scene.add(sun);

function mat(c,r=.7,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
function box(w,h,d,c,r=.7,m=0){const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,r,m));x.castShadow=x.receiveShadow=true;return x}
function cyl(rad,h,c){const x=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,20),mat(c,.7));x.castShadow=x.receiveShadow=true;return x}
function plane(w,d,c){const x=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c,1));x.rotation.x=-Math.PI/2;x.receiveShadow=true;return x}

const ground=plane(320,320,0x718b69);scene.add(ground);
function road(x,z,w,d){const r=box(w,.07,d,0x303438,1);r.position.set(x,.04,z);scene.add(r);for(let i=-w/2+6;i<w/2;i+=12){const mark=box(.22,.075,3.5,0xe6cc72,1);mark.position.set(x+i,.09,z);scene.add(mark)}}
road(0,0,28,270);road(-78,0,24,270);road(78,0,24,270);road(0,-105,185,24);road(0,0,185,24);road(0,105,185,24);

const houses=[];let id=1;
function addWindow(g,x,y,z,w=3.1,h=2.0){
 const frame=box(w+.25,h+.25,.16,0x22282c,.5,.2);frame.position.set(x,y,z);g.add(frame);
 const glass=box(w,h,.11,0x8db9c8,.12,.25);glass.position.set(x,y,z-.08);g.add(glass);
 const mull=box(.10,h-.15,.18,0x252b2e,.4,.2);mull.position.set(x,y,z-.15);g.add(mull);
}
function addDoor(g,x,y,z){
 const f=box(2.4,4.2,.22,0x3a3029,.45);f.position.set(x,y,z);g.add(f);
 const d=box(2.05,3.85,.12,0x76513d,.55);d.position.set(x,y,z-.14);g.add(d);
 const h=cyl(.09,.15,0xd7b45b);h.rotation.z=Math.PI/2;h.position.set(x+.72,y,z-.23);g.add(h);
}
function furniture(g){
 // living room
 const sofa=box(5.4,1.15,2.0,0xc9b8a2,.65);sofa.position.set(-3,1.05,1.7);g.add(sofa);
 for(const x of [-5,-3.2,-1.4]){const arm=box(1.1,1.9,2.05,0xc9b8a2,.65);arm.position.set(x,1.35,1.7);g.add(arm)}
 const table=box(2.7,.35,1.35,0x6d4935,.45);table.position.set(-1.8,.55,-1.3);g.add(table);
 const rug=plane(6,4,0x8e806f);rug.position.set(-2,.03,-1);g.add(rug);
 const tv=box(5.2,3.0,.16,0x111417,.3,.2);tv.position.set(-7,3.0,-3.9);g.add(tv);
 const tvunit=box(5.8,.55,.8,0x493c34,.55);tvunit.position.set(-7,.45,-3.4);g.add(tvunit);
 // kitchen
 for(let x=-5;x<=4;x+=2.25){const cab=box(2,.9,1.05,0xf0ece5,.45);cab.position.set(x,.75,-8);g.add(cab)}
 const counter=box(11,.25,1.3,0x5d6468,.35,.15);counter.position.set(0,1.38,-8);g.add(counter);
 const island=box(3.4,.95,1.5,0xeee8df,.45);island.position.set(3,1,-5.2);g.add(island);
 // dining
 const dt=box(3.6,.2,2.0,0x704a34,.45);dt.position.set(7,.95,-2);g.add(dt);
 for(const x of [5.8,8.2])for(const z of [-3.2,-.8]){const c=box(.75,1.1,.75,0xb49d82,.6);c.position.set(x,.55,z);g.add(c)}
 // bedroom upstairs
 const bed=box(4.2,.65,6.0,0xeee8df,.55);bed.position.set(2,8.1,5);g.add(bed);
 const mattress=box(3.9,.45,5.6,0xddd4c5,.8);mattress.position.set(2,8.65,5);g.add(mattress);
 for(const x of [0,4]){const pillow=box(1.5,.25,1.1,0xf7f4ee,.9);pillow.position.set(x,9,6.8);g.add(pillow)}
 const wardrobe=box(4.5,3.2,.8,0x70533e,.5);wardrobe.position.set(-5,9,-3);g.add(wardrobe);
 // bathroom fixtures
 const tub=box(3,.75,1.8,0xf6f6f2,.2);tub.position.set(7,8,-8);g.add(tub);
 const sink=cyl(.65,.45,0xf5f5f2);sink.position.set(4,8.35,-8);g.add(sink);
 const toilet=cyl(.62,.65,0xf3f3ef);toilet.position.set(9,8.3,-5.5);g.add(toilet);
}
function modernHouse(x,z,number){
 const g=new THREE.Group();g.position.set(x,0,z);
 g.userData={id:'بيت '+number,title:'بيت '+number,price:'منزل عصري — 280 م²',rooms:'4 غرف • 3 حمامات • صالة • مطبخ • كراج',group:g};
 // floor / slab
 const floor=box(22,.35,20,0xb8aa98,1);floor.position.y=.18;g.add(floor);
 // exterior walls with real openings
 const wallColor=0xe9e5dc, dark=0x252a2d;
 const back=box(22,9,.45,wallColor,.8);back.position.set(0,4.5,-9.75);g.add(back);
 const left=box(.45,9,20,wallColor,.8);left.position.set(-10.75,4.5,0);g.add(left);
 const right=box(.45,9,20,wallColor,.8);right.position.set(10.75,4.5,0);g.add(right);
 // front divided around large glazing + door
 const f1=box(6,9,.45,wallColor,.8);f1.position.set(-8,4.5,9.75);g.add(f1);
 const f2=box(6,9,.45,wallColor,.8);f2.position.set(8,4.5,9.75);g.add(f2);
 const ftop=box(10,3.2,.45,wallColor,.8);ftop.position.set(0,7.9,9.75);g.add(ftop);
 addDoor(g,0,2.2,9.72);addWindow(g,-5,4.8,9.7,4.7,3.0);addWindow(g,5,4.8,9.7,4.7,3.0);
 // upper floor / master wing
 const upper=box(15,4.8,9,dark,.55,.05);upper.position.set(1,11,-1);g.add(upper);
 const upperFront=box(15,4.8,.4,dark,.55,.05);upperFront.position.set(1,11,3.65);g.add(upperFront);
 addWindow(g,-2,11,3.35,3.2,2.0);addWindow(g,4,11,3.35,3.2,2.0);
 // roof
 const roof=box(24,.7,22,0x20272b,.5,.15);roof.position.y=13.45;g.add(roof);
 // balcony
 const balcony=box(13,.25,4,0xb6aa99,.9);balcony.position.set(1,8.7,5.2);g.add(balcony);
 for(let x=-5;x<=7;x+=2)for(const zz of [3.35,7]){const rail=box(.12,1.1,.12,0x30363a,.4,.3);rail.position.set(x,9.3,zz);g.add(rail)}
 // entrance steps
 for(let i=0;i<3;i++){const st=box(5,.25,1.0,0xaaa29a,.9);st.position.set(0,.3+i*.25,10.5+i*.8);g.add(st)}
 // driveway and garage
 const drive=plane(8,12,0x858585);drive.position.set(-7,.03,14);g.add(drive);
 const garage=box(6,4.5,.25,0x2e3437,.45);garage.position.set(-7,2.4,-10);g.add(garage);
 // landscaping
 const yard=plane(28,28,0x789568);yard.position.set(0,.02,0);g.add(yard);
 // re-add floor so yard doesn't cover interior
 const insideFloor=plane(20,19,0xddd2c3);insideFloor.position.set(0,.22,0);g.add(insideFloor);
 furniture(g);
 // trees/pots
 for(const px of [-9,9]){const pot=cyl(.8,.6,0x9b6b4e);pot.position.set(px,.35,12);g.add(pot);const tr=cyl(.16,2.2,0x76513f);tr.position.set(px,1.7,12);g.add(tr);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25,16,12),mat(0x3d7549,.95));crown.position.set(px,3.2,12);g.add(crown)}
 scene.add(g);houses.push(g);return g;
}
const coords=[[-48,-82],[-22,-82],[22,-82],[48,-82],[-48,-48],[-22,-48],[22,-48],[48,-48],[-48,48],[-22,48],[22,48],[48,48],[-48,82],[-22,82],[22,82],[48,82]];
coords.forEach((p,i)=>modernHouse(p[0],p[1],i+1));
function tree(x,z){const t=cyl(.55,4,0x76513f);t.position.set(x,2,z);scene.add(t);const c=new THREE.Mesh(new THREE.SphereGeometry(3.2,14,10),mat(0x47764a,1));c.position.set(x,5.7,z);c.castShadow=true;scene.add(c)}
for(let x=-90;x<=90;x+=18){tree(x,-118);tree(x,118)}for(let z=-100;z<=100;z+=18){tree(-92,z);tree(92,z)}
let selected=null,inside=false;
const list=document.getElementById('houses');
houses.forEach((h,i)=>{const b=document.createElement('button');b.className='house';b.textContent=h.userData.title;b.onclick=()=>select(h);list.appendChild(b)});
function select(h){selected=h;inside=false;document.getElementById('enterBtn').textContent='دخول البيت';document.querySelectorAll('.house').forEach((b,i)=>b.classList.toggle('active',houses[i]===h));document.getElementById('info').classList.add('show');document.getElementById('infoTitle').textContent=h.userData.title;document.getElementById('infoText').textContent=h.userData.price+' • '+h.userData.rooms}
function goHouse(){if(!selected)return;camera.position.set(selected.position.x+25,13,selected.position.z+27);controls.target.copy(selected.position);controls.update()}
document.getElementById('goBtn').onclick=goHouse;
document.getElementById('topView').onclick=()=>{inside=false;camera.position.set(0,155,0);controls.target.set(0,0,0);controls.update()};
document.getElementById('enterBtn').onclick=()=>{
 if(!selected)return;
 inside=!inside;
 if(inside){camera.position.set(selected.position.x,2.4,selected.position.z+7.8);controls.target.set(selected.position.x,2.6,selected.position.z-3);controls.maxDistance=30;controls.minDistance=.3}
 else {goHouse();controls.maxDistance=190;controls.minDistance=3}
 document.getElementById('enterBtn').textContent=inside?'خروج من البيت':'دخول البيت';
 controls.update();
};
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.key').forEach(b=>{const k=b.dataset.k;b.onpointerdown=()=>keys[k]=true;b.onpointerup=()=>keys[k]=false;b.onpointercancel=()=>keys[k]=false;b.onpointerleave=()=>keys[k]=false});
let last=performance.now();
function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;
 const speed=(inside?7:18)*dt;const dir=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();const side=new THREE.Vector3().crossVectors(dir,camera.up).normalize();
 if(keys.w)camera.position.addScaledVector(dir,speed);if(keys.s)camera.position.addScaledVector(dir,-speed);if(keys.a)camera.position.addScaledVector(side,speed);if(keys.d)camera.position.addScaledVector(side,-speed);
 controls.update();renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
select(houses[0]);
</script>
</body>
</html>
